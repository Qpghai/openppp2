name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Deps
        run: |
          brew install cmake ninja boost
          echo "BOOST_PREFIX=$(brew --prefix boost)" >> $GITHUB_ENV

      - name: Fix iOS source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("ppp/app/client/AssignedAddressManager.cpp")
          s=p.read_text()
          s=s.replace(
          '#if defined(_WIN32)\n#include <windows/ppp/tap/TapWindows.h>\n#else\n#include <common/unix/UnixAfx.h>\n#if defined(_MACOS)\n#include <darwin/ppp/tap/TapDarwin.h>\n#else\n#include <linux/ppp/tap/TapLinux.h>\n#endif\n#endif',
          '#if defined(_WIN32)\n#include <windows/ppp/tap/TapWindows.h>\n#elif defined(_IPHONE)\n#elif defined(_MACOS)\n#include <common/unix/UnixAfx.h>\n#include <darwin/ppp/tap/TapDarwin.h>\n#else\n#include <common/unix/UnixAfx.h>\n#include <linux/ppp/tap/TapLinux.h>\n#endif')
          p.write_text(s)
          PY

      - name: Build XCFramework
        run: |
          export BOOST_ROOT="$BOOST_PREFIX"
          export BOOST_INCLUDEDIR="$BOOST_PREFIX/include"
          export CXXFLAGS="-I$BOOST_PREFIX/include"
          IOS_DEVICE_ARCHS=arm64 IOS_DEPLOYMENT_TARGET=15.0 ./ios/build-xcframework.sh

      - name: Build OpenSSL
        run: |
          test -n "${OPENSSL_TARBALL:-}" || {
            echo "Set OPENSSL_TARBALL first"
            exit 1
          }
          ./ios/build-openssl.sh

      - name: Build IPA
        run: |
          SDK=iphoneos CONFIGURATION=Release ./ios/App/build-unsigned.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: openppp2-ios
          path: bin/ipa/*.ipa