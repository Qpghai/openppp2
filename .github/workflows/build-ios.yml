name: Build · iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          brew install cmake ninja boost openssl

          BOOST_PREFIX="$(brew --prefix boost)"
          OPENSSL_PREFIX="$(brew --prefix openssl)"

          test -f "$BOOST_PREFIX/include/boost/version.hpp"
          test -f "$OPENSSL_PREFIX/include/openssl/ssl.h"

          echo "BOOST_PREFIX=$BOOST_PREFIX" >> "$GITHUB_ENV"
          echo "BOOST_INCLUDEDIR=$BOOST_PREFIX/include" >> "$GITHUB_ENV"
          echo "OPENSSL_PREFIX=$OPENSSL_PREFIX" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDEDIR=$OPENSSL_PREFIX/include" >> "$GITHUB_ENV"

      - name: Clean build
        run: |
          rm -rf build/ios-device
          rm -rf build/ios-simulator
          rm -rf build/ios-headers
          rm -rf bin/OpenPPP2.xcframework
          rm -rf bin/OpenPPP2.*.xcframework

      - name: Build XCFramework
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x ios/build-xcframework.sh

          export BOOST_ROOT="$BOOST_PREFIX"
          export BOOST_INCLUDEDIR="$BOOST_INCLUDEDIR"
          export OPENSSL_ROOT_DIR="$OPENSSL_PREFIX"
          export OPENSSL_INCLUDE_DIR="$OPENSSL_INCLUDEDIR"

          export CFLAGS="-I$BOOST_INCLUDEDIR -I$OPENSSL_INCLUDEDIR"
          export CXXFLAGS="-I$BOOST_INCLUDEDIR -I$OPENSSL_INCLUDEDIR"

          echo "BOOST_INCLUDEDIR=$BOOST_INCLUDEDIR"
          echo "OPENSSL_INCLUDEDIR=$OPENSSL_INCLUDEDIR"
          echo "CXXFLAGS=$CXXFLAGS"

          IOS_DEVICE_ARCHS=arm64 \
          IOS_DEPLOYMENT_TARGET=15.0 \
          ./ios/build-xcframework.sh- name: Verify XCFramework
        run: |
          set -euxo pipefail
          test -d bin/OpenPPP2.xcframework
          find bin/OpenPPP2.xcframework -maxdepth 5 -print

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x ios/App/build-unsigned.sh
          ./ios/App/build-unsigned.sh

      - name: Inspect outputs
        if: always()
        run: |
          echo "===== IPA ====="
          find . -type f -name '*.ipa' -print || true

          echo "===== APP ====="
          find . -type d -name '*.app' -print || true

          echo "===== XCFramework ====="
          find . -type d -name '*.xcframework' -print || true

      - name: Find IPA
        shell: bash
        run: |
          set -e

          IPA="$(find . -type f -name '*.ipa' | head -n 1)"

          if [ -z "$IPA" ]; then
            echo "::error::No IPA was generated"
            exit 1
          fi

          echo "IPA_BUNDLE=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"

      - name: Verify IPA
        run: |
          set -euxo pipefail
          test -f "$IPA_BUNDLE"
          file "$IPA_BUNDLE"
          unzip -l "$IPA_BUNDLE" | head -100

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: openppp2-ios-unsigned
          path: ${{ env.IPA_BUNDLE }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: openppp2-ios-xcframework
          path: bin/OpenPPP2.xcframework
          if-no-files-found: error
          retention-days: 14