name: Build · iOS

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show toolchain
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          sw_vers
          xcodebuild -version
          cmake --version
          ninja --version || true
          clang --version

      - name: Install build dependencies
        run: |
          set -euxo pipefail

          brew install cmake ninja boost openssl

          BOOST_PREFIX="$(brew --prefix boost)"
          OPENSSL_PREFIX="$(brew --prefix openssl)"

          echo "Boost prefix: $BOOST_PREFIX"
          echo "OpenSSL prefix: $OPENSSL_PREFIX"

          test -f "$BOOST_PREFIX/include/boost/version.hpp"
          test -f "$OPENSSL_PREFIX/include/openssl/ssl.h"

          echo "BOOST_PREFIX=$BOOST_PREFIX" >> "$GITHUB_ENV"
          echo "BOOST_INCLUDEDIR=$BOOST_PREFIX/include" >> "$GITHUB_ENV"
          echo "OPENSSL_PREFIX=$OPENSSL_PREFIX" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDEDIR=$OPENSSL_PREFIX/include" >> "$GITHUB_ENV"

      - name: Build OpenPPP2 XCFramework
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x ios/build-xcframework.sh

          echo "Boost:"
          echo "$BOOST_PREFIX"
          echo "$BOOST_INCLUDEDIR"

          echo "OpenSSL:"
          echo "$OPENSSL_PREFIX"
          echo "$OPENSSL_INCLUDEDIR"

          test -f "$BOOST_INCLUDEDIR/boost/version.hpp"

          export BOOST_ROOT="$BOOST_PREFIX"
          export BOOST_INCLUDEDIR="$BOOST_INCLUDEDIR"

          export OPENSSL_ROOT_DIR="$OPENSSL_PREFIX"
          export OPENSSL_INCLUDE_DIR="$OPENSSL_INCLUDEDIR"

          export CXXFLAGS="-I$BOOST_INCLUDEDIR -I$OPENSSL_INCLUDEDIR ${CXXFLAGS:-}"
          export CFLAGS="-I$BOOST_INCLUDEDIR -I$OPENSSL_INCLUDEDIR ${CFLAGS:-}"

          echo "CXXFLAGS=$CXXFLAGS"
          echo "CFLAGS=$CFLAGS"

          IOS_DEVICE_ARCHS=arm64 \
          IOS_DEPLOYMENT_TARGET=15.0 \
          ./ios/build-xcframework.sh

      - name: Verify XCFramework
        run: |
          set -euxo pipefail

          test -d bin/OpenPPP2.xcframework

          find bin/OpenPPP2.xcframework \
            -maxdepth 3 \
            -type f \
            -print

          du -sh bin/OpenPPP2.xcframework

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x ios/App/build-unsigned.sh

          ./ios/App/build-unsigned.sh

      - name: Inspect iOS outputs
        if: always()
        run: |
          set -x

          echo "===== IPA ====="
          find . \
            -type f \
            -name '*.ipa' \
            -print

          echo "===== APP ====="
          find . \
            -type d \
            -name '*.app' \
            -print

          echo "===== XCFramework ====="
          find . \
            -type d \
            -name '*.xcframework' \
            -print

          echo "===== Archives ====="
          find . \
            -type d \
            -name '*.xcarchive' \
            -print

          echo "===== bin ====="
          find bin \
            -maxdepth 5 \
            -print 2>/dev/null || true

      - name: Find IPA
        shell: bash
        run: |
          set -e

          IPA="$(find . \
            -type f \
            -name '*.ipa' \
            | head -n 1)"

          if [ -z "$IPA" ]; then
            echo "::error::No IPA was generated"
            exit 1
          fi

          echo "IPA_BUNDLE=$IPA" >> "$GITHUB_ENV"

          echo "Found IPA:"
          ls -lh "$IPA"

      - name: Verify IPA
        shell: bash
        run: |
          set -euxo pipefail

          test -f "$IPA_BUNDLE"

          file "$IPA_BUNDLE"

          unzip -l "$IPA_BUNDLE" | head -100

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: openppp2-ios-unsigned
          path: ${{ env.IPA_BUNDLE }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: openppp2-ios-xcframework
          path: bin/OpenPPP2.xcframework
          if-no-files-found: error
          retention-days: 14