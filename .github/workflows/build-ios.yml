name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies
        run: |
          brew install cmake ninja boost openssl@3
          brew fetch --build-from-source openssl@3
          echo "BOOST_PREFIX=$(brew --prefix boost)" >> "$GITHUB_ENV"
          echo "OPENSSL_TARBALL=$(brew --cache --build-from-source openssl@3)" >> "$GITHUB_ENV"

      - name: Fix iOS source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("ppp/app/client/AssignedAddressManager.cpp")
          s = p.read_text()

          old = """#if defined(_WIN32)
          #include <windows/ppp/tap/TapWindows.h>
          #else
          #include <common/unix/UnixAfx.h>
          #if defined(_MACOS)
          #include <darwin/ppp/tap/TapDarwin.h>
          #else
          #include <linux/ppp/tap/TapLinux.h>
          #endif
          #endif"""

          new = """#if defined(_WIN32)
          #include <windows/ppp/tap/TapWindows.h>
          #elif defined(_IPHONE)
          #elif defined(_MACOS)
          #include <common/unix/UnixAfx.h>
          #include <darwin/ppp/tap/TapDarwin.h>
          #else
          #include <common/unix/UnixAfx.h>
          #include <linux/ppp/tap/TapLinux.h>
          #endif"""

          if old not in s:
              raise SystemExit("AssignedAddressManager.cpp pattern not found")

          p.write_text(s.replace(old, new))
          PY

      - name: Build iOS OpenSSL
        run: |
          ./ios/build-openssl.sh

      - name: Build XCFramework
        run: |
          export BOOST_ROOT="$BOOST_PREFIX"
          export BOOST_INCLUDEDIR="$BOOST_PREFIX/include"

          OPENSSL_PREFIX="$GITHUB_WORKSPACE/bin/openssl-ios/iphoneos-arm64"

          export CFLAGS="-I$OPENSSL_PREFIX/include -I$BOOST_PREFIX/include"
          export CXXFLAGS="-I$OPENSSL_PREFIX/include -I$BOOST_PREFIX/include"

          IOS_DEVICE_ARCHS=arm64 \
          IOS_SIMULATOR_ARCHS=arm64 \
          IOS_DEPLOYMENT_TARGET=15.0 \
          ./ios/build-xcframework.sh

      - name: Build IPA
        run: |
          SDK=iphoneos \
          CONFIGURATION=Release \
          ./ios/App/build-unsigned.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: openppp2-ios
          path: bin/ipa/*.ipa