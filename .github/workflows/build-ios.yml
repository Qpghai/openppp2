- name: TrollStore IPA
        run: |
          mkdir -p /tmp/p
          unzip -q bin/ipa/OpenPPP2-iphoneos.ipa -d /tmp/p

          cat >/tmp/e <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>com.apple.developer.networking.networkextension</key>
          <array><string>packet-tunnel-provider</string></array>
          <key>com.apple.security.application-groups</key>
          <array><string>group.openppp2</string></array>
          </dict></plist>
          EOF

          APP=/tmp/p/Payload/OpenPPP2.app
          ldid -S/tmp/e "$APP/OpenPPP2"
          ldid -S/tmp/e "$APP/PlugIns/OpenPPP2PacketTunnel.appex/OpenPPP2PacketTunnel"

          mkdir -p bin/ipa/out/Payload
          cp -R "$APP" bin/ipa/out/Payload/
          cd bin/ipa/out
          zip -qry ../OpenPPP2-TrollStore.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: openppp2-trollstore
          path: bin/ipa/OpenPPP2-TrollStore.ipa